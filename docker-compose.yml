services:
  whatsapp-seerr:
    image: ghcr.io/mercuryvapors/whatsapp-seerr:latest
    container_name: whatsapp-seerr
    restart: unless-stopped
    network_mode: bridge
    # Lets the container reach services on the Unraid host via
    # http://host.docker.internal:5055 (e.g. Overseerr running on the host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7000:7000"
    # Unraid: labels drive the WebUI button shown on the Docker page
    labels:
      - net.unraid.docker.webui=http://[IP]:[PORT:7000]
      - net.unraid.docker.icon=https://raw.githubusercontent.com/mercuryvapors/whatsapp-seerr/main/public/icon.svg
      - net.unraid.docker.shell=bash
    # Chromium's renderer crashes with Docker's default 64MB /dev/shm
    shm_size: 1gb
    volumes:
      - ./data:/data
      # Lets the app ask Docker to restart this container (General Settings ->
      # Auto-restart). Without it, the restart falls back to exiting the
      # process, which only comes back if the restart policy is set.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATA_DIR=/data
      - PUPPETEER_SKIP_DOWNLOAD=false
      - PORT=7000
      # Timezone for the daily auto-restart schedule (set to your local zone)
      # - TZ=Europe/Amsterdam
      # Optional: force every request through a dedicated Seerr user
      # (overrides the "Impersonate as user" fields in the web UI).
      # Uncomment and set on your Unraid box; do not commit real passwords:
      # - SEERR_IMPERSONATE_EMAIL=request
      # - SEERR_IMPERSONATE_PASSWORD=your-password